  - problem:
      leetcode: 2379
      title: Minimum Recolors to Get K Consecutive Black Blocks
    pattern: fixed-size-sliding-window-minimization
    result: solved_independently
    session_date: 2026-07-18
    hint_level: 0
    conceptual_mistakes:
      - briefly confused the first incoming index k with the first-window final index k-1
      - needed correction when stating complete old and new window intervals
    implementation_mistakes: []
    mastered_during_session:
      - minimum recolors equals the minimum count of W over all length-k windows
      - before processing i the old window is [i-k,i-1]
      - after processing i the new window is [i-k+1,i]
      - optimized complexity is O(n) time and O(1) extra space
