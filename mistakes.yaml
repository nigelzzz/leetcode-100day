      title: Maximum Number of Vowels in a Substring of Given Length
    pattern: fixed-size-sliding-window
    result: solved_with_hint
    session_date: 2026-07-17
    hint_level: 1
    conceptual_mistakes:
      - confused the incoming-character index with the window-start index
      - initially did not preserve the completed first window as the initial maximum
    implementation_mistakes:
      - mixed loop-variable names across initialization and sliding loops
      - initially used incomplete vowel-membership syntax
    mastered_during_session:
