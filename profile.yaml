  - first correct space complexity with a because-clause (155 - O(n), min_st as tall as st), one drill after 763's O(n)-for-O(1) miss
  - asks the precise question that exposes his own misunderstanding (155 'so the pop need to pop min val?')
  - clears a three-item fix list in a single draft to a full pass (155 draft 2, 14/14)
  - recovers fully in single-question mode after a failed multi-item round (692 - eviction direction, adversarial expected output, and tie branch each fixed in one short exchange)
  - retained the exact reverse(ans.begin(), ans.end()) spelling across drills (735 slip, correct on 692)
  - challenges an unrealistic premise from the interviewer (973 - 'noone can use x+y'), which led to a better adversarial
  - adapts a just-taught template to a new problem independently and compile-clean on draft 1 (09-15, 104 BFS from 102; 226 DFS shape unaided)
  - first unaided draft-1 pass on a new problem (21 Merge Two Sorted Lists, 09-15, 8/8, compile-clean, checklist fully applied)
