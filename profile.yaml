weaknesses:
  - tends to skip clarification and brute-force reasoning before optimized code
  - needs deliberate off-by-one checks for legal window counts and index ranges
  - reports complexity by feel instead of deriving it (819 O(nB), 49 n log k, 128 n*k; 56 answered O(n) for a sort-based algorithm; 763 answered space O(n) one line after writing '26 char last occur index'); time-complexity because-clauses are now reliable, SPACE complexity is the remaining gap - ask whether the structure grows with n
  - carries per-iteration state across loop iterations and relies on a sibling branch to reset it (128 cnt)
  - variable-name and API-spelling inconsistencies across drafts (isalpha, l_m/lm, original_str/original; grid/g in both 200 and 994; queue pop_front in 994)
  - refactors a passing solution without re-running tests (49 draft 3 regressed)
  - resubmits near-identical drafts after a multi-item bug list instead of addressing each item (improved by 200: fixed four items in one draft)
  - skips direct interviewer questions and submits code instead (200 two skipped; 994 three skipped; 994 redo 09-04 three skipped again — recurring Earn Trust risk); 09-15 tree session skipped checkpoints a and b three times while answering c, then answered both instantly one at a time
  - first drafts ignore explicit written requirements from the prompt (994 — mark-on-push and fresh tracking both listed, both skipped)
  - TOP RECURRING SLIP - writes expected outputs in the wrong TYPE (994 all-zero grid, wrong again on 09-04 redo; 238 scored 0/3; 09-07 review wrote [] as [0]; 56 gave an operator with no operands; 763 gave the segment count 1 instead of [4]; 09-11 review wrote [0,5] instead of [[0,5]]) - four straight sessions, then CLEAN on 692 (09-13, all vector<string> literals) - but k was omitted from every case; rule - look at the function's return type BEFORE writing an expected output
  - state variable read from one source and written from another (994 redo found never set; 394 cur written twice while ss was returned; 56 second_val compared against but updated from intervals[i-1][1]; 226 swap(left, right) on local copies left the tree unchanged) - named pattern: declaration/assignment/READ three-liner
  - line-pointing fix-list verification submitted twice ever (735 complete; 763 partial after three bounces, and the ONE row left blank was exactly the unfixed bug) - the gate demonstrably works, it is not yet voluntary
  - TOP WEAKNESS - does not apply a fix list that names the exact line and the exact text (994 orangesRottings twice; 735 ans.reverse() after being handed reverse(ans.begin(), ans.end()); 56 interval->intervals skipped with the spelling and 3 line numbers given, and the same push_back [0] error survived 3 explicit corrections; 155 getmin for the given getMin; 692 resubmitted pre-code answers with only k changed after a worked walk showed the eviction direction was wrong); rule - open the file and fix each item before replying, never in bulk from memory
  - variable shadowing recurred until it caused a real infinite loop (735 draft 1; warned in 994 redo and 394)
  - clarify questions answerable from stated constraints (238 empty array, 347 k vs uniques, 394 k=0; first clean drill LC 3 on 09-05 — answered "constraints are clear")
  - container API mixups under time pressure (994 queue pop_front, 347 priority_queue push_back, 199 mock queue top)
  - pre-submit walk (238 skipped twice; LC 3 skipped; 56 trimmed the supplied case; 763 never delivered) - BREAKTHROUGH on 155, a complete correct walk arrived with the first submission; the remaining gap is walking the CODE rather than the intended algorithm (155 walk was right while push never filled min_st); 692 walk narrated a pop the code did not contain; 973 walk matched the code for the first time but its wrong result was never compared to expected - rule: last line of every walk is 'expected ___, match / no match'
  - builds adversarial cases that the wrong solution survives (53 [2,3,-9,4]; 155 push 1,2,3 then pop removes a non-minimum); the three-step method was taught on 155 - name the wrong solution's state, find the operation that should change it but cannot, build the shortest sequence that triggers it; valid killers so far - LC 3 zaaac, 763 abca
  - leaves the sign-compare warning unfixed (i < v.size()); 7 drills running - 763's final submission still carries it on the first loop after three separate reminders; fix is (int)v.size()
  - writes an if that guards one case and gives the other case no path (155 if (!min_st.empty()) with no else - min_st never filled, segfault; 692 tie branch if (a < b) with no equal-count guard); rule - for every guard, say what the else path does
  - size-k heap written without either pop twice running (692 and 973 draft 1 - no pop when size > k, top read k times with no pop)
  - overflow judged by feel (973 - computed 10^8 instead of 2*10^8, then called for long long against his own number); rule - compute the max, compare with 2.1e9
  - space complexity omits the recursion stack (763 O(n) for a 26-entry table; 695 O(1) in mock 3; SAME answer in the real phone screen 2026-09-17) - rule: recursion costs two things, the structures allocated AND the stack depth
  - accepts outside code over his own correct reasoning (973 pasted min-heap comparator contradicted his correct dist(a) < dist(b)) and does not say when a draft came from elsewhere
  - spoken approach contradicts the code he then writes (199 mock - said 'push val if node->right exists', coded right-first BFS taking each level's first node); interviewers score what they hear
  - states an untraced output as if walked (141 mock 2 - 'it print true' while the code returned false at line 2); never claim a result that was not traced
  - fixes whatever an interviewer's question points at but initiates almost none of the process himself (mocks 2 and 3 - walks, expected-output checks, space complexity and compile checks all only after being asked); mock 3 sent code before clarify/examples/approach
  - asks for a sample answer instead of attempting LP questions (09-15 - three sample requests, Ownership question in mock 3 left unanswered)
