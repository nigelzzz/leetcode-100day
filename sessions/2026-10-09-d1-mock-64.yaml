verdict: No Hire for the mock itself (four drafts, 87-94 percent failure rates, walk needed four requests), with a strong recovery phase
root_causes:
  - 'spoken approach and written code diverged - said "first row and column accumulate" then wrote raw grid assignments'
  - 'the walk traced the intended algorithm instead of the written code, so it caught nothing; this is the third consecutive session with the same failure'
  - 'fix-list non-compliance again - the corrected line dp[i][0] = dp[i-1][0] + grid[i][0] was given verbatim and only the dp half was applied; same shape as 56 on 2026-09-08'
  - 'test cases chosen were the ones that pass - 3x3 all-ones and 2x2 both mask the index shift'
rules_installed:
  - 'a walk means acting as the CPU - read each line and write down what THAT LINE computes, even when the value is obviously wrong; if you are thinking "what should this cell be" the walk cannot catch a bug'
  - 'grid DP base row/col is a prefix sum - dp[previous cell] + grid[current cell]; the index paired with grid is always the current i or j, the previous index appears only on dp'
  - 'never patch a wrong result at the return statement (draft 1 added grid[0][0] at the end); go back to the cause'
  - 'include 1x1 in the examples for any grid problem - it is the case where no loop body runs'
verified_reference:
  rolling_O_n: 'dp[0] += grid[i][0] then dp[j] = min(dp[j], dp[j-1]) + grid[i][j], scanning j ascending; 7/7 and 0 mismatches over 20000 random grids'
  in_place_O_1: 'accumulate into grid itself; 7/7 and 0 mismatches over 20000 random grids'
  wrong_direction: 'scanning j descending fails 10269 of 20000 random grids because dp[j-1] is then the previous row (up-left) rather than the current row (left)'
gates:
  gate_1_lean_hire_or_better: 0 of 1
  gate_2_six_steps_unprompted: 0 of 1 (7 prompts across steps 3 and 4, 4 for the walk)
  gate_3_space_with_stack_term: met
