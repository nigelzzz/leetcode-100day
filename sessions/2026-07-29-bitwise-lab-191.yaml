problems:
  - leetcode: 191
    title: Number of 1 Bits
    pattern: bit-manipulation-clear-lowest-set-bit
    role: main
    result: solved_with_hint
    time_minutes: null
    hint_level: 3
    complexity:
      time: O(k), where k is the number of set bits
      space: O(1)
    conceptual_mistakes:
      - initially stated O(n) without defining n; fixed-width 32-bit scanning is O(1), while generalized scanning is O(w)
      - initially treated n & (n - 1) as a break condition rather than a state transition
      - initially incremented the count only when the updated n remained nonzero
    implementation_mistakes:
      - initially used signed 1 << 31 instead of unsigned 1u << 31
      - wrote !n & (n - 1), which is parsed as (!n) & (n - 1)
    communication_notes:
      - described the operation imprecisely as removing the first bit from the right rather than clearing the rightmost set bit
    edge_cases_proposed:
      - "0x00000000 -> 0"
      - "0xFFFFFFFF -> 32"
      - "0x00000001 -> 1"
