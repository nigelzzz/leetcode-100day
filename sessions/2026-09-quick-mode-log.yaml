    - date: 2026-09-24
      leetcode: 746
      title: Min Cost Climbing Stairs
      minutes: 10
      independence: hint (dp definition had to be pinned down first)
      complexity: "O(n) time, O(1) space with the rolling version (wrote O(1) for time by slip)"
      cluster: Dynamic Programming (3/26)
      root_cause: "definition, transition and base case came from two different definitions at once - dp[0] = cost[0] (definition B) with a transition shaped like 198 (definition A)"
      taught:
        - "definition A: dp[i] = cost to REACH step i, dp[i] = min(dp[i-1] + cost[i-1], dp[i-2] + cost[i-2]), answer dp[n]"
        - "definition B: dp[i] = cost to STAND on step i, dp[i] = cost[i] + min(dp[i-1], dp[i-2]), answer min(dp[n-1], dp[n-2])"
        - "an asymmetric transition (cost added on only one branch) is always wrong"
        - "to write a transition ask: where could the previous step have been, and what does that move cost"
      right:
        - "[1,10,1] -> 2 is his first genuine adversarial example (kills 'step on every stair')"
        - rolling version correct on the first try, 3004/3004
      issues:
        - "array version declared dp(n, 0) but writes and reads dp[n] - AddressSanitizer confirms heap-buffer-overflow, and it still returned the right answer, which is the dangerous case"
        - "time complexity written as O(1) while the because said n loops"
