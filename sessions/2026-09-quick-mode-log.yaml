        - "output space is never counted; auxiliary space is the map (O(n)) versus the interleave trick (O(1))"
      decision: "map version is the primary answer; interleave is a three-sentence verbal follow-up until pointer fluency improves (revisit after 206 rewrite, 21, then 25)"
