    - date: 2026-10-05
      leetcode: 138
      title: Copy List with Random Pointer
      minutes: null
      independence: taught
      cluster: Linked List (8/18)
      what_happened:
        - "confused by the LeetCode serialization [val, randomIndex] - clarified that next comes from array order"
        - "asked good question: why is the interleave version O(1) space when it calls new n times - led to the output-vs-auxiliary distinction he had missed on LC 2"
