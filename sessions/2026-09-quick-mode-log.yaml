    - date: 2026-09-23
      type: consolidation
      topic: one binary-search template for everything
      content: "firstTrue(lo, hi, p) over the half-open range [lo, hi): while (lo < hi) { mid; if (p(mid)) hi = mid; else lo = mid + 1; } return lo. Verified against 35, 704, 34, 278, 153, 162, 875 - 1320/1320."
      rule: "hi is one past the last candidate, usually n; the template never reads nums[hi]; 704 becomes this template plus a nums[lo] == target check; only 33 (rotated exact match) stays outside it"
      review: "153 re-derived with the template - all four blanks correct, and p true -> hi = mid answered correctly"
    - date: 2026-09-23
      type: decision
      topic: one binary-search style
      decision: "classic closed range, because that is the shape he writes by reflex (three times today he wrote l <= r and n - 1 unprompted)"
      template: "l = 0, r = n - 1, ans = default; while (l <= r) { mid; if (good(mid)) { ans = mid; r = mid - 1; } else l = mid + 1; } return ans"
      verified: "works for 35 (3000 random distinct arrays), 34 (2000 random), 278, 153 (45 rotations), 875, and 162 (3379 random zigzags); 33 stays the exception"
      traps: "do not return on first match when the first or last index is wanted; keep the comparison anchor fixed - 153 must compare with nums[n-1], and comparing with the moving nums[r] failed 11 of 45 rotations"
    - date: 2026-09-24
      leetcode: 1283
      title: Find the Smallest Divisor Given a Threshold
      minutes: 15
      independence: hint (three bugs corrected)
      complexity: "O(n log max); O(1)"
      first_draft: "lo = 0 (divisor zero), ceil(nums[i] / mid) which is a no-op after integer division, and lo <= hi paired with hi = mid - infinite loop on all four cases"
      second_draft: "ans = hi instead of ans = mid - returned 9 for [1,2,5,9] th=6"
      final: "4007/4007 including 4000 random cases against brute force, and 5e4 piles of 1e6"
      clarify: "FIRST time he asked four real clarifying questions unprompted (zeros? round up per element or on the sum? is threshold >= n guaranteed? ranges?) - the rounding question is the one that changes the algorithm"
      learned:
        - "ceil in C++ cannot fix integer division: ceil(5/2) is 2; use (a + b - 1) / b"
        - "ans records the value just verified (mid), never the boundary (hi)"
        - "the two templates: lo <= hi with hi = mid - 1 and ans, or lo < hi with hi = mid and return lo - the three lines move together"
        - "binary search on the answer needs a legal lower bound (divisor cannot be 0)"
      note: "walk written in comments described the intended algorithm, not the code he wrote (third occurrence); stale walk comments left in the submission"
