follow_up:
  question: one stack, O(1) extra space
  user_answer: "a) negative diff means val is the new minimum - correct; b) min updates to val - correct; c) i don't know"
  taught:
    - store diff = val - min; negative diff means val became the new min
    - "restore on pop: min = min - diff, because min_new - (val - min_old) = min_old"
    - "top(): diff > 0 -> min + diff, else the element is min itself"
    - long long diff is required - INT_MAX - INT_MIN overflows int, and the constraints range is the hint
  reference: scratchpad t155f.cpp, 17/17 including INT_MIN/INT_MAX and 30k stress

