lesson:
  - top-k largest uses a size-k MIN-heap (root is the weakest candidate, gets evicted);
    max-heap holds all u elements and pops k
  - one-shot heapify via range constructor is O(u); per-element push is O(u log u)
  - pop cost is one root-to-leaf sift, O(log u), never a full re-heapify

