confidentiality:
  - no company, product, repository or internal URL names in interviews or in these notes

facts_confirmed_by_user:
  - "problem: a kernel module cached file hashes keyed by full path; each entry held a PATH_MAX name buffer (~4 KB per entry)"
  - "change: key by device ID + inode number + ctime; hash input 12 bytes instead of up to 4 KB; three integer compares instead of strcmp"
  - "ctime in the key makes the cache miss automatically when a file changes; write/delete hooks kept because ctime may not update immediately"
  - "inode reuse was considered at design time: ctime in the key distinguishes a new file that reuses a freed inode number"
  - "result: documented ~4 KB -> ~68 B per entry; 1,024 entries ~4 MB -> ~69 KB (~98% less)"
  - "benchmark (UnixBench index): 3217.9 -> 3266.0, ~1.5%, within ~1% run-to-run deviation, reported as no significant CPU change"

trigger: noticed the hash cache was consuming more memory than it should

