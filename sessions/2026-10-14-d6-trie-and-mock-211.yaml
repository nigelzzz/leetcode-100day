track: daily mock week 1, day 6
request: 'user asked to be taught Trie before mocking ("i am no familiar trie, please teach me then start mock again") - the cluster was at zero coverage'
taught:
  problem: {leetcode: 208, title: Implement Trie}
  points:
    - 'the only reason Trie exists - a hash set also does insert and search in O(L), but startsWith becomes O(n*L) while a Trie does it in O(L), independent of how many words are stored'
    - 'node holds child[26] (zero-initialised with = {}) and isEnd; characters live on the edges and a node represents the prefix reached so far'
    - 'all three operations share one walk routine and differ only in the last step - startsWith needs the walk to succeed, search needs the walk plus isEnd, insert creates missing edges'
    - 'isEnd is what separates "this path exists" from "this is a word"; after inserting apple, search(app) must be false while startsWith(app) is true'
    - 'measured the bug - a search that omits the isEnd check was wrong on 1501 of 36000 random operations'
    - 'array[26] versus unordered_map<char, Node*> - 208 bytes per node and pure indexing, versus only the edges that exist at the cost of hashing; small fixed alphabet favours the array'
    - 'memory - the plain version leaks; mention a destructor, or a vector<Node> plus integer indices, which also removes one allocation per node and suits an arena or static buffer (relevant to the embedded role)'
  verification: 'array version and map version both agreed with set<string> over 36000 random operations'
mock:
  problem: {leetcode: 211, title: Design Add and Search Words Data Structure}
  reason_chosen: '208 had just been taught, so the mock used the problem that applies a Trie instead of restating it'
  steps:
