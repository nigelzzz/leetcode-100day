session_date: 2026-10-08
type: teaching
track: 2D DP curriculum (lesson 1 of 4)
trigger: user asked to finish learning 2D DP before resuming mocks ("我想先 學完 2 dim dp 在 mock, 再回來")
taught:
  - problem: {leetcode: 1143, title: Longest Common Subsequence}
    role: worked example
    points:
      - how to recognise 2D DP - two independently advancing indices are needed to describe a subproblem
      - state definition - first i chars of text1 vs first j chars of text2
      - why "first i" and not "ending at i" - subsequence does not require contiguity
      - transition - equal gives dp[i-1][j-1]+1, unequal gives max(dp[i-1][j], dp[i][j-1])
      - scan order is valid because dp[i][j] only depends on up-left, up and left, all already computed
      - time O(m*n) because subproblem count (m+1)(n+1) times O(1) per cell; space O(m*n) with no recursion so no stack term
      - follow-up - rolling two rows gives O(min(m,n)) space
  - problem: {leetcode: 718, title: Longest Common Substring}
    role: contrast (part B1)
    points:
      - definition changes to "ending at s1[i-1] and s2[j-1]" because substring must be contiguous
      - therefore the unequal branch is 0, not a max of neighbours
      - therefore the answer is the maximum over the whole table, not dp[m][n]
      - lesson - changing one sentence in the definition changes both the transition and where the answer lives
  - topic: LCS string reconstruction (part B2)
    points:
      - walk back from dp[m][n]; equal means take the char and move up-left, otherwise move to the larger neighbour
      - reverse at the end; O(m+n) because each step decrements i or j
      - trade-off worth volunteering - reconstruction forbids the rolling-array optimisation
  - topic: table conventions A vs B
    points:
      - A is (m+1)x(n+1) with a sentinel row and column; base case is free
      - B is m x n with no sentinel; costs four hand-written boundary blocks plus an empty-input special case
      - verified equivalent on 20000 random pairs, but the common B bug (skipping row 0 and col 0) silently gives wrong answers on 7 of 13 cases
      - five things move together - sentinel ring, table dims, loop start, string index, answer cell
      - decision - always use A for two-sequence 2D DP
