new_rules_installed:
  - dp[i][j] means i is the row means the row axis is the first string; label i and j on the drawn table before filling it
  - always convention A for two-sequence 2D DP - trade one ring of zeros for four boundary blocks
  - time complexity because-clause must be "subproblem count times cost per subproblem", never "two loops"
  - transpose invariance (1143, 718, 72, 64, 62) is worth volunteering because it justifies putting the shorter string inside for O(min(m,n)) space; 115 and 392 are asymmetric and cannot be swapped
